ar(--aqua2)}.classes{display:grid;gap:9px}.class{display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:12px}.class .time{font-size:18px;font-weight:900}.capacity{font-size:11px;color:var(--muted);margin-top:4px}.bar{height:5px;border-radius:99px;background:#edf1f2;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--aqua)}.form{display:grid;gap:12px}.field{display:grid;gap:5px}.field label{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#60717a}.field input,.field select,.field textarea{width:100%;border:1px solid #d8e2e5;border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink)}.field textarea{min-height:88px;resize:vertical}.cols{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid #edf1f2;text-align:left;white-space:nowrap}.table th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.table tr:hover td{background:#fbfcfd}.link{border:0;background:none;color:var(--aqua2);padding:0;font-weight:800}.empty{padding:28px;text-align:center;color:var(--muted)}.modalBg{position:fixed;inset:0;background:rgba(14,30,40,.5);z-index:100;display:grid;place-items:center;padding:18px}.modal{background:#fff;width:min(720px,100%);max-height:88vh;overflow:auto;border-radius:18px;padding:20px;box-shadow:0 30px 90px rgba(0,0,0,.22)}.modal.wide{width:min(1000px,100%)}.toast{position:fixed;right:20px;bottom:20px;background:#172a3a;color:#fff;padding:12px 15px;border-radius:11px;z-index:200;box-shadow:var(--shadow);max-width:420px}.toast.err{background:#a84235}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 15%,#d7faf5 0,transparent 32%),radial-gradient(circle at 85% 80%,#eeeaff 0,transparent 30%),#f7f9fb}.authCard{width:min(450px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 24px 70px rgba(28,54,66,.14)}.authCard h1{font-size:30px;margin:8px 0}.authTabs{display:grid;grid-template-columns:1fr 1fr;background:#eef3f5;padding:4px;border-radius:11px;margin:18px 0}.authTabs button{border:0;background:transparent;border-radius:8px;padding:9px;font-weight:800;color:#6e7d84}.authTabs button.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06)}.source{display:inline-flex;gap:6px;align-items:center;color:var(--aqua2);font-size:11px;font-weight:800;text-decoration:none}.pub{padding:10px 12px;border-radius:11px;background:#f0faf8;border:1px solid #d3efea}.dateNav{display:flex;gap:8px;align-items:center}.dateNav input{border:1px solid var(--line);padding:9px;border-radius:9px}.mobileNav{display:none}.divisionTabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.divisionTabs button{border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:#fff;font-weight:800;color:#657680}.divisionTabs button.active{background:var(--aqua);color:white;border-color:var(--aqua)}@media(max-width:1050px){.g4{grid-template-columns:repeat(2,1fr)}.scaleGrid{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}@media(max-width:760px){.shell{display:block;padding-bottom:66px}.side{display:none}.top{padding:0 12px}.top h1{font-size:17px}.user{gap:7px}.userMeta{display:none}.top .btn{padding:8px 10px}.content{padding:15px}.g4,.g3,.g2,.cols{grid-template-columns:1fr}.scaleGrid{grid-template-columns:1fr}.planRow{grid-template-columns:54px 1fr}.planRow>div:last-child{grid-column:1/-1}.class{grid-template-columns:80px 1fr}.class>div:last-child{grid-column:1/-1;display:flex;gap:7px}.mobileNav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;height:62px;background:#fff;border-top:1px solid var(--line);z-index:50}.mobileNav button{border:0;background:#fff;font-size:10px;font-weight:800;color:#76848a}.mobileNav button.active{color:var(--aqua2);background:#f0faf8}.sectionHead{align-items:start;flex-direction:column}}
</style>
<style>
.filterBar{display:grid;grid-template-columns:minmax(220px,2fr) repeat(2,minmax(150px,1fr));gap:10px;align-items:end}.filterBar.scoreFilters{grid-template-columns:minmax(220px,2fr) repeat(3,minmax(140px,1fr))}.resultMeta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 10px}.wodGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.wodCompact{display:flex;flex-direction:column;min-height:245px}.wodCompact h3{font-size:20px;margin:9px 0 6px}.wodSummary{color:#53656e;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;white-space:pre-line}.tagRow{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.cardActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:12px}.todayActions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px;margin-top:14px;border:1px solid #d3efea;border-radius:12px;background:#f0faf8}.scoreStatus strong{display:block;font-size:18px;color:var(--aqua2)}.quickActions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.searchInput{position:relative}.searchInput input{padding-left:34px}.searchInput:before{content:'⌕';position:absolute;left:12px;bottom:9px;color:var(--muted);font-size:18px;z-index:1}.dangerLink{color:#b94d3d}.subtleCard{box-shadow:none;background:#fbfcfd}@media(max-width:1050px){.wodGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.filterBar,.filterBar.scoreFilters{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.wodGrid,.filterBar,.filterBar.scoreFilters{grid-template-columns:1fr}.resultMeta{align-items:flex-start}.todayActions{align-items:flex-start}.cardActions .btn{flex:1}}

<body>
<div id="auth" class="auth"><div class="authCard"><div class="brand" style="color:#17252d;margin:0"><div class="mark">C</div><div><b>Citadel Fitness Hub</b><small style="display:block;color:#718089">Training & Class Management</small></div></div><h1>Welcome</h1><p class="muted">Programming, reservations, scores and athlete history in one place.</p><div class="authTabs"><button id="signInTab" class="active">Sign In</button><button id="signUpTab">Create Account</button></div><form id="authForm" class="form"><div id="nameField" class="field hidden"><label>Full name</label><input id="authName" autocomplete="name"></div><div class="field"><label>Email</label><input id="authEmail" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="authPassword" type="password" minlength="6" required autocomplete="current-password"></div><button id="authSubmit" class="btn">Sign In</button><div id="authMsg" class="muted"></div></form></div></div>
<div id="app" class="shell hidden"><aside class="side"><div class="brand"><div class="mark">C</div><div><b>Citadel Fitness Hub</b><small>Member Management</small></div></div><nav id="nav" class="nav"></nav><div class="sideFoot"><div id="cloudState">● Live cloud database</div><button id="signOutSide" class="btn secondary small" type="button" style="margin-top:10px">Log out</button></div></aside><main class="main"><header class="top"><h1 id="pageTitle">Dashboard</h1><div class="user"><div class="userMeta"><b id="userName"></b><div id="userRole" class="muted" style="font-size:11px;text-align:right"></div></div><div id="avatar" class="avatar">C</div><button id="signOutTop" class="btn secondary small" type="button" aria-label="Log out of Citadel Fitness Hub">Log out</button></div></header><div id="view" class="content"></div></main><nav id="mobileNav" class="mobileNav"></nav></div>
<div id="modal" class="modalBg hidden"><div id="modalBox" class="modal"></div></div><div id="toast" class="toast hidden"></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const URL='https://oknjnuhtbtyvfvbquvtk.supabase.co',KEY='sb_publishable_mSVpE6QDk6sLbUKEhk5W9A_yVzwNcY7';
const sb=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const humanDate=d=>new Intl.DateTimeFormat('en-US',{weekday:'long',month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(d+'T12:00:00Z'));
const fmtTime=t=>{let[h,m]=String(t).slice(0,5).split(':').map(Number),ap=h>=12?'PM':'AM';return `${h%12||12}:${String(m).padStart(2,'0')} ${ap}`};
const id=()=>crypto.randomUUID(); let mode='signin',ctx=null,tab='',viewRequest=0,S={athletes:[],wods:[],programming:[],publications:[],classes:[],reservations:[],scores:[],coachNotes:[],availability:{}};
function toast(msg,err=false){const x=$('#toast');x.textContent=msg;x.className='toast'+(err?' err':'');x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),3400)}
function fail(e){console.error(e);toast(e?.message||String(e),true)}
async function q(table,sel='*'){const{data,error}=await sb.from(table).select(sel);if(error)throw error;return data||[]}
async function authCtx(){const{data:{session}}=await sb.auth.getSession();if(!session)return null;const{data,error}=await sb.from('profiles').select('*').eq('user_id',session.user.id).maybeSingle();if(error)throw error;return{session,profile:data}}
async function load(){const[a,w,p,u,c,r,s]=await Promise.all([q('athletes'),q('wods'),q('programming'),q('publications'),q('class_templates'),q('reservations'),q('scores')]);S.athletes=a;S.wods=w;S.programming=p;S.publications=u;S.classes=c.filter(x=>x.active).sort((a,b)=>a.start_time.localeCompare(b.start_time));S.reservations=r;S.scores=s;S.coachNotes=ctx?.profile?.role==='coach'?await q('coach_notes'):[];}
async function loadAvailability(d){const{data,error}=await sb.rpc('get_class_availability',{p_date:d});if(error)throw error;S.availability[d]=Object.fromEntries((data||[]).map(x=>[x.class_template_id,x]));}
function activeNav(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
const coachTabs=[['dashboard','Dashboard'],['programming','Programming'],['wods','WOD Library'],['classes','Classes'],['athletes','Athletes'],['scores','Scores'],['leaderboard','Leaderboard']];
const athleteTabs=[['today','Today'],['leaderboard','Leaderboard'],['schedule','Schedule'],['results','My Results']];
function shell(){const tabs=ctx.profile.role==='coach'?coachTabs:athleteTabs;$('#nav').innerHTML=tabs.map(x=>`<button data-tab="${x[0]}">${x[1]}</button>`).join('');$('#mobileNav').innerHTML=tabs.map(x=>`<button data-tab="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));$('#userName').textContent=ctx.profile.display_name||ctx.session.user.email;$('#userRole').textContent=ctx.profile.role==='coach'?'Coach / Admin':'Athlete';$('#avatar').textContent=(ctx.profile.display_name||'C')[0].toUpperCase();tab=tab||tabs[0][0];go(tab)}
function go(t){tab=t;activeNav();const all=[...coachTabs,...athleteTabs],label=all.find(x=>x[0]===t)?.[1]||'Citadel';$('#pageTitle').textContent=label;render().catch(fail)}
function wodForDate(d){const p=S.programming.filter(x=>x.workout_date===d).sort((a,b)=>a.sort_order-b.sort_order);return p.map(x=>({...x,wod:S.wods.find(w=>w.id===x.wod_id)})).filter(x=>x.wod)}
function published(d){return S.publications.some(x=>x.workout_date===d)}
function scaleHtml(w){const names=['RX','Intermediate','Beginner','Masters','At Home'];return `<div class="scaleGrid">${names.map(n=>`<div class="scale"><b>${n}</b><p>${esc(w.scaling_options?.[n]||'Not specified')}</p></div>`).join('')}</div>`}
function planHtml(w){const p=w.class_plan||[];return p.length?`<div class="plan">${p.map(x=>`<div class="planRow"><div class="time">${esc(x[0])}</div><b>${esc(x[1])}</b><div class="muted">${esc(x[2])}</div></div>`).join('')}</div>`:''}
function wodHtml(w,coach=false){return `<div class="wod"><div class="row between wrap"><div><span class="badge ${w.category==='Recovery'?'wait':'rx'}">${esc(w.category)}</span> <span class="badge">${esc(w.score_type)}</span></div>${w.source_url?`<a class="source" target="_blank" rel="noopener" href="${esc(w.source_url)}">CrossFit.com source ↗</a>`:''}</div><h3>${esc(w.name)}</h3><div class="wodText">${esc(w.description)}</div>${scaleHtml(w)}${coach?`<div style="margin-top:14px"><div class="eyebrow">60-minute coach plan</div>${planHtml(w)}</div>`:''}</div>`}
function scoreTypeLabel(t){return String(t||'custom').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase())}
function compactWodHtml(w){const tags=(w.tags||[]).slice(0,4),summary=String(w.description||'').replace(/\s+/g,' ').trim();return `<div class="card wodCompact"><div><span class="badge ${w.category==='Recovery'?'wait':'rx'}">${esc(w.category||'Other')}</span> <span class="badge">${esc(scoreTypeLabel(w.score_type))}</span></div><h3>${esc(w.name)}</h3><div class="wodSummary">${esc(summary||'Workout details available inside.')}</div><div class="tagRow">${tags.map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</div><div class="cardActions"><button class="btn small viewWod" data-w="${esc(w.id)}">View workout</button><button class="btn secondary small seePlan" data-w="${esc(w.id)}">Coach plan</button></div></div>`}
function openWod(wid,coach=false){const w=S.wods.find(x=>x.id===wid);if(!w)return;modal(`<div class="sectionHead"><div><h2>${esc(w.name)}</h2><p>${coach?'Coach class plan and workout details':'Workout details and scaling options'}</p></div><button class="btn secondary close">Close</button></div>${wodHtml(w,coach)}`);$('.close').onclick=closeModal}
function bindWodCards(){document.querySelectorAll('.viewWod').forEach(b=>b.onclick=()=>openWod(b.dataset.w,false));document.querySelectorAll('.seePlan').forEach(b=>b.onclick=()=>openWod(b.dataset.w,true))}
function stats(){return{ath:S.athletes.filter(a=>a.status==='Active').length,wods:S.wods.length,scores:S.scores.length,res:S.reservations.filter(r=>r.class_date===today()&&['reserved','checked_in'].includes(r.status)).length}}
async function render(){const request=++viewRequest,target=tab;if(target==='dashboard')return renderDashboard(request);if(target==='programming')return renderProgramming();if(target==='wods')return renderWods();if(target==='classes')return renderClasses(request);if(target==='athletes')return renderAthletes();if(target==='scores')return renderScores();if(target==='today')return renderToday(request);if(target==='leaderboard')return renderLeaderboard(request);if(target==='schedule')return renderSchedule(request);if(target==='results')return renderResults()}
async function renderDashboard(request){await loadAvailability(today());if(request!==viewRequest||tab!=='dashboard')return;const x=stats(),prog=wodForDate(today());$('#view').innerHTML=`<div class="sectionHead"><div><h2>${humanDate(today())}</h2><p>At-a-glance operations for Citadel Fitness Hub.</p></div><span class="badge ${published(today())?'live':'draft'}">${published(today())?'Published':'Draft'}</span></div><div class="quickActions"><button class="btn small" id="dashProgram">Program today</button><button class="btn violet small" id="dashScore">Log a score</button><button class="btn secondary small" id="dashBoard">Open leaderboard</button></div><div class="grid g4"><div class="card stat"><span class="eyebrow">Active athletes</span><strong>${x.ath}</strong></div><div class="card stat"><span class="eyebrow">WOD library</span><strong>${x.wods}</strong></div><div class="card stat"><span class="eyebrow">Scores logged</span><strong>${x.scores}</strong></div><div class="card stat"><span class="eyebrow">Today's reservations</span><strong>${x.res}</strong></div></div><div class="grid g2" style="margin-top:16px"><div class="card">${prog.length?prog.map(x=>wodHtml(x.wod,true)).join(''):'<div class="empty">No workout programmed today.</div>'}</div><div class="card"><div class="sectionHead"><div><h2>Today's classes</h2><p>12-athlete limit per class.</p></div></div>${classList(today(),true)}</div></div>`;$('#dashProgram').onclick=()=>{sessionStorage.progDate=today();go('programming')};$('#dashScore').onclick=()=>scoreForm(true,prog[0]?.wod?.id||null);$('#dashBoard').onclick=()=>{sessionStorage.leaderDate=today();if(prog[0]?.wod?.id)sessionStorage.leaderWod=prog[0].wod.id;go('leaderboard')};bindClassActions()}
function classList(d,coach=false){const dow=new Date(d+'T12:00:00Z').getUTCDay(),classes=S.classes.filter(c=>(c.days||[]).includes(dow));if(!classes.length)return'<div class="empty">No classes scheduled.</div>';const own=ctx.profile.athlete_id;return `<div class="classes">${classes.map(c=>{const av=S.availability[d]?.[c.id]||{reserved_count:0,waitlist_count:0,capacity:c.capacity,waitlist_enabled:c.waitlist_enabled},mine=S.reservations.find(r=>r.class_template_id===c.id&&r.class_date===d&&r.athlete_id===own&&r.status!=='cancelled'),pct=Math.min(100,(av.reserved_count/av.capacity)*100),full=av.reserved_count>=av.capacity;let actions='';if(coach)actions=`<button class="btn secondary small roster" data-c="${c.id}" data-d="${d}">Roster</button>`;else if(mine?.status==='reserved')actions=`${d===today()?`<button class="btn violet small checkin" data-r="${mine.id}">Check In</button>`:''}<button class="btn danger small cancel" data-r="${mine.id}">Cancel</button>`;else if(mine?.status==='waitlist')actions=`<span class="badge wait">Waitlisted</span><button class="btn danger small cancel" data-r="${mine.id}">Cancel</button>`;else if(mine?.status==='checked_in')actions=`<span class="badge in">Checked In</span>`;else actions=`<button class="btn small reserve" data-c="${c.id}" data-d="${d}">${full&&av.waitlist_enabled?'Join Waitlist':'Reserve'}</button>`;return`<div class="class"><div class="time">${fmtTime(c.start_time)}</div><div><b>${esc(c.name)}</b><div class="capacity">${av.reserved_count}/${av.capacity} reserved${av.waitlist_count?` · ${av.waitlist_count} waitlisted`:''}</div><div class="bar"><i style="width:${pct}%"></i></div></div><div>${actions}</div></div>`}).join('')}</div>`}
function bindClassActions(){document.querySelectorAll('.reserve').forEach(b=>b.onclick=()=>reserve(b.dataset.c,b.dataset.d));document.querySelectorAll('.cancel').forEach(b=>b.onclick=()=>cancelRes(b.dataset.r));document.querySelectorAll('.checkin').forEach(b=>b.onclick=()=>checkin(b.dataset.r));document.querySelectorAll('.roster').forEach(b=>b.onclick=()=>roster(b.dataset.c,b.dataset.d))}
async function reserve(c,d,athlete=null){const{data,error}=await sb.rpc('reserve_class',{p_class_id:c,p_class_date:d,p_athlete_id:athlete});if(error)throw error;const state=data?.status||data?.[0]?.status;toast(state==='waitlist'?'Class is full — you are on the waitlist.':`You're booked for ${humanDate(d)}. See you in class!`);await load();await loadAvailability(d);render()}

async function roster(c,d){const cl=S.classes.find(x=>x.id===c),rows=S.reservations.filter(r=>r.class_template_id===c&&r.class_date===d&&r.status!=='cancelled'),name=a=>{let x=S.athletes.find(v=>v.id===a);return x?`${x.first_name} ${x.last_name}`:'Athlete'};modal(`<div class="sectionHead"><div><h2>${fmtTime(cl.start_time)} roster</h2><p>${humanDate(d)} · ${rows.filter(x=>['reserved','checked_in'].includes(x.status)).length}/${cl.capacity}</p></div><button class="btn secondary close">Close</button></div><div class="tableWrap"><table class="table"><thead><tr><th>Athlete</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(name(r.athlete_id))}</td><td><span class="badge ${r.status==='checked_in'?'in':r.status==='waitlist'?'wait':'rx'}">${r.status.replace('_',' ')}</span></td><td>${r.status==='reserved'?`<button class="link rosterCheck" data-r="${r.id}">Check in</button> · `:''}${r.status!=='checked_in'?`<button class="link rosterCancel" data-r="${r.id}">Remove</button>`:''}</td></tr>`).join('')||'<tr><td colspan="3">No reservations yet.</td></tr>'}</tbody></table></div><div class="row" style="margin-top:15px"><select id="addAth" style="flex:1;padding:10px;border:1px solid var(--line);border-radius:9px"><option value="">Add athlete…</option>${S.athletes.filter(a=>a.status==='Active').map(a=>`<option value="${a.id}">${esc(a.first_name+' '+a.last_name)}</option>`).join('')}</select><button id="addAthBtn" class="btn">Add</button></div>`);$('.close').onclick=closeModal;document.querySelectorAll('.rosterCheck').forEach(b=>b.onclick=async()=>{await checkin(b.dataset.r);closeModal();roster(c,d)});document.querySelectorAll('.rosterCancel').forEach(b=>b.onclick=async()=>{await cancelRes(b.dataset.r);closeModal();roster(c,d)});$('#addAthBtn').onclick=async()=>{if(!$('#addAth').value)return;await reserve(c,d,$('#addAth').value);closeModal();roster(c,d)}}
async function renderProgramming(){const d=sessionStorage.progDate||today();const prog=wodForDate(d),library=[...S.wods].sort((a,b)=>a.name.localeCompare(b.name));$('#view').innerHTML=`<div class="sectionHead"><div><h2>Daily Programming</h2><p>Attach a reusable WOD to a date, then publish it to athletes.</p></div><div class="dateNav"><input id="progDate" type="date" value="${d}"><button id="pubBtn" class="btn ${published(d)?'danger':''}">${published(d)?'Unpublish':'Publish'}</button></div></div><div class="card">${prog.length?prog.map(x=>`<div style="margin-bottom:18px">${wodHtml(x.wod,true)}<div class="row" style="margin-top:10px"><button class="btn danger small removeProg" data-id="${x.id}">Remove from day</button></div></div>`).join(''):'<div class="empty">No WOD attached to this date.</div>'}</div><div class="card" style="margin-top:16px"><div class="sectionHead"><div><h2>Add from WOD Library</h2><p>${library.length} reusable workouts, sorted alphabetically.</p></div></div><div class="row wrap"><select id="progWod" style="flex:1;min-width:240px;padding:10px;border:1px solid var(--line);border-radius:9px"><option value="">Select WOD…</option>${library.map(w=>`<option value="${w.id}">${esc(w.name)} · ${esc(w.category||'Other')}</option>`).join('')}</select><button id="addProg" class="btn">Add to ${d}</button></div></div>`;$('#progDate').onchange=e=>{sessionStorage.progDate=e.target.value;renderProgramming()};$('#pubBtn').onclick=async()=>{if(published(d)){let{error}=await sb.from('publications').delete().eq('workout_date',d);if(error)throw error}else{let{error}=await sb.from('publications').upsert({workout_date:d,published_at:new Date().toISOString(),origin:'coach'});if(error)throw error}await load();renderProgramming()};$('#addProg').onclick=async()=>{if(!$('#progWod').value)return;let{error}=await sb.from('programming').insert({workout_date:d,section:'Workout of the Day',wod_id:$('#progWod').value,sort_order:prog.length,origin:'coach'});if(error)throw error;awai function renderWods(){const library=[...S.wods].sort((a,b)=>a.name.localeCompare(b.name)),categories=[...new Set(library.map(w=>w.category||'Other'))].sort(),scoreTypes=[...new Set(library.map(w=>w.score_type||'custom'))].sort();$('#view').innerHTML=`<div class="sectionHead"><div><h2>WOD Library</h2><p>Find, preview, and program reusable workouts without scrolling through every full workout.</p></div><button id="newWod" class="btn">+ New WOD</button></div><div class="card subtleCard"><div class="filterBar"><div class="field searchInput"><label>Search workouts</label><input id="wodSearch" type="search" placeholder="Name, movement, tag, or description"></div><div class="field"><label>Category</label><select id="wodCategory"><option value="">All categories</option>${categories.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Score type</label><select id="wodScoreType"><option value="">All score types</option>${scoreTypes.map(x=>`<option value="${esc(x)}">${esc(scoreTypeLabel(x))}</option>`).join('')}</select></div></div></div><div class="resultMeta"><div><b id="wodCount">${library.length} workouts</b><div class="muted">Open only the details you need.</div></div><button class="link" id="clearWodFilters">Clear filters</button></div><div id="wodGrid" class="wodGrid"></div>`;const apply=()=>{const query=$('#wodSearch').value.trim().toLowerCase(),category=$('#wodCategory').value,type=$('#wodScoreType').value,filtered=library.filter(w=>(!category||(w.category||'Other')===category)&&(!type||(w.score_type||'custom')===type)&&(!query||JSON.stringify([w.name,w.category,w.description,w.tags,w.scaling_options]).toLowerCase().includes(query)));$('#wodCount').textContent=`${filtered.length} ${filtered.length===1?'workout':'workouts'}`;$('#wodGrid').innerHTML=filtered.map(compactWodHtml).join('')||'<div class="card empty" style="grid-column:1/-1">No workouts match those filters.</div>';bindWodCards()};$('#wodSearch').oninput=app function newWod(){const scales=['RX','Intermediate','Beginner','Masters','At Home'];modal(`<div class="sectionHead"><div><h2>Create WOD</h2><p>All five scaling options are required.</p></div><button class="btn secondary close">Close</button></div><form id="wodForm" class="form"><div class="cols"><div class="field"><label>Name</label><input id="wn" required></div><div class="field"><label>Category</label><select id="wc"><option>Conditioning</option><option>Strength</option><option>Gymnastics</option><option>Weightlifting</option><option>Monostructural</option><option>Mixed Modal</option><option>Recovery</option><option>Skill</option><option>Other</option></select></div></div><div class="cols"><div class="field"><label>Score type</label><select id="ws"><option value="time">Time</option><option value="reps">Reps</option><option value="rounds_reps">Rounds + Reps</option><option value="weight">Weight</option><option value="distance">Distance</option><option value="calories">Calories</option><option value="points">Points</option><option value="interval_times">Interval Times</option><option value="total_weight">Total Weight</option><option value="custom">Custom</option></select></div><div class="field"><label>Time cap</label><input id="wt" placeholder="e.g. 15:00"></div></div><div class="field"><label>Workout</label><textarea id="wd" required></textarea></div>${scales.map((n,i)=>`<div class="field"><label>${n}</label><textarea id="sc${i}" required></textarea></div>`).join('')}<button class="btn">Save WOD</button></form>`);$('.close').onclick=closeModal;$('#wodForm').onsubmit=async e=>{e.preventDefault();const scaling={};scales.forEach((n,i)=>scaling[n]=$(`#sc${i}`).value);const{error}=await sb.from('wods').insert({name:$('#wn').value,category:$('#wc').value,score_type:$('#ws').value,time_cap:$('#wt').value,description:$('#wd').value,scaling_options:scaling,class_plan:[],score_config:{},scaling_score_types:{},tags:['Citadel']});if(error)throw error;closeModal();await load() function renderAthletes(){const rows=[...S.athletes].sort((a,b)=>a.last_name.localeCompare(b.last_name));$('#view').innerHTML=`<div class="sectionHead"><div><h2>Members</h2><p>Membership status, contact details, attendance, private coaching notes, and workout history.</p></div><button id="newAth" class="btn">+ Add Member</button></div><div class="card subtleCard"><div class="filterBar"><div class="field searchInput"><label>Search members</label><input id="memberSearch" type="search" placeholder="Name, email, phone"></div><div class="field"><label>Membership status</label><select id="memberStatus"><option value="">All statuses</option><option>Active</option><option>On Hold</option><option>Inactive</option></select></div><div class="field"><label>Sort</label><select id="memberSort"><option value="name">Last name</option><option value="recent">Recently joined</option><option value="attendance">Most check-ins</option></select></div></div></div><div class="resultMeta"><b id="memberCount">${rows.length} members</b><button class="link" id="clearMemberFilters">Clear filters</button></div><div class="card tableWrap"><table class="table"><thead><tr><th>Member</th><th>Contact</th><th>Status</th><th>Joined</th><th>Check-ins</th></tr></thead><tbody id="memberRows"></tbody></table></div>`;const apply=()=>{const q=$('#memberSearch').value.trim().toLowerCase(),status=$('#memberStatus').value,sort=$('#memberSort').value;let filtered=rows.filter(a=>(!status||a.status===status)&&(!q||[a.first_name,a.last_name,a.email,a.phone].join(' ').toLowerCase().includes(q)));if(sort==='recent')filtered.sort((a,b)=>String(b.join_date||'').localeCompare(String(a.join_date||'')));else if(sort==='attendance')filtered.sort((a,b)=>S.reservations.filter(r=>r.athlete_id===b.id&&r.status==='checked_in').length-S.reservations.filter(r=>r.athlete_id===a.id&&r.status==='checked_in').length);else filtered.sort((a,b)=>a.last_name.localeCompare(b.last_name));$('#memberCount').textContent=`${filtered.length} mem function athleteDetail(aid){const a=S.athletes.find(x=>x.id===aid);if(!a)return;const scores=S.scores.filter(s=>s.athlete_id===aid).sort((a,b)=>b.score_date.localeCompare(a.score_date)),attendance=S.reservations.filter(r=>r.athlete_id===aid&&r.status!=='cancelled').sort((a,b)=>b.class_date.localeCompare(a.class_date)),notes=S.coachNotes.filter(n=>n.athlete_id===aid).sort((a,b)=>b.created_at.localeCompare(a.created_at));modal(`<div class="sectionHead"><div><h2>${esc(a.first_name+' '+a.last_name)}</h2><p>${esc(a.email||'No email')} · ${esc(a.phone||'No phone')}</p></div><div class="row"><button class="btn secondary editAthlete">Edit member</button><button class="btn secondary close">Close</button></div></div><div class="pub"><b>${esc(a.status)}</b><div class="muted">Joined ${esc(a.join_date||'—')} · ${esc(a.notes||'No general notes')}</div></div><h3>Coach notes</h3><form id="coachNoteForm" class="form"><textarea id="coachNoteText" placeholder="Private coaching note: goals, modifications, follow-up…" required></textarea><button class="btn small">Add private note</button></form><div style="margin-top:10px">${notes.slice(0,10).map(n=>`<div class="pub" style="margin-top:8px"><div>${esc(n.note)}</div><div class="muted" style="font-size:11px;margin-top:5px">${new Date(n.created_at).toLocaleString()}</div></div>`).join('')||'<div class="muted">No private coaching notes yet.</div>'}</div><h3>Attendance history <span class="badge">${attendance.filter(r=>r.status==='checked_in').length} check-ins</span></h3><div class="tableWrap"><table class="table"><thead><tr><th>Date</th><th>Class</th><th>Status</th></tr></thead><tbody>${attendance.slice(0,20).map(r=>{const c=S.classes.find(x=>x.id===r.class_template_id)||{};return `<tr><td>${esc(r.class_date)}</td><td>${esc(c.name||'Class')} · ${esc(c.start_time?fmtTime(c.start_time):'')}</td><td><span class="badge ${r.status==='checked_in'?'in':r.status==='waitlist'?'wait':'rx'}">${esc(r.status.replace('_',' '))}</span></td></tr>`}).join(' function scoreValue(s){if(s.score_type==='time')return fmtSec(s.time_seconds);if(s.score_type==='reps')return`${s.reps} reps`;if(s.score_type==='rounds_reps')return`${s.rounds}+${s.reps}`;if(s.score_type==='weight')return`${s.weight} lb`;if(s.score_type==='distance')return`${s.distance}`;if(s.score_type==='calories')return`${s.calories} cal`;if(s.score_type==='points')return`${s.points}`;if(s.score_type==='interval_times')return(s.interval_seconds||[]).map(fmtSec).join(' · ');if(s.score_type==='total_weight')return`${s.weight??(s.lift_weights||[]).reduce((a,b)=>a+Number(b),0)} lb`;return s.custom_text||'Complete'}
function fmtSec(v){v=Number(v||0);return`${Math.floor(v/60)}:${String(v%60).padStart(2,'0')}`}
function athleteName(aid){const a=S.athletes.find(x=>x.id===aid);return a?`${a.first_name} ${a.last_name}`:'Athlete'}
function scoreTable(rows,opts={}){const showAthlete=!!opts.showAthlete,actions=!!opts.actions,colspan=4+(showAthlete?1:0)+(actions?1:0);return `<div class="tableWrap"><table class="table"><thead><tr><th>Date</th>${showAthlete?'<th>Athlete</th>':''}<th>Workout</th><th>Division</th><th>Score</th>${actions?'<th></th>':''}</tr></thead><tbody>${rows.map(s=>{let w=S.wods.find(x=>x.id===s.wod_id);return`<tr><td>${esc(s.score_date)}</td>${showAthlete?`<td><b>${esc(athleteName(s.athlete_id))}</b></td>`:''}<td>${esc(w?.name||'Workout')}</td><td><span class="badge ${s.division==='RX'?'rx':''}">${esc(s.division)}</span></td><td><b>${esc(scoreValue(s))}</b></td>${actions?`<td><button class="link dangerLink deleteScore" data-score="${esc(s.id)}">Remove</button></td>`:''}</tr>`}).join('')||`<tr><td colspan="${colspan}">No results match these filters.</td></tr>`}</tbody></table></div>`}
function renderScores(){const rows=[...S.scores].sort((a,b)=>b.score_date.localeCompare(a.score_date)),athletes=[...S.athletes].sort((a,b)=>athleteName(a.id).localeCompare(athleteName(b.id))),wods=[...S.wods].filter(w=>rows.some(s=>s.wod_id===w.id)).sort((a,b)=>a.name.localeCompare(b.name));$('#view').innerHTML=`<div class="sectionHead"><div><h2>Scores</h2><p>Search athlete performance, enter results, and correct accidental entries.</p></div><button id="logScore" class="btn">+ Log Score</button></div><div class="card subtleCard"><div class="filterBar scoreFilters"><div class="field searchInput"><label>Search scores</label><input id="scoreSearch" type="search" placeholder="Athlete or workout"></div><div class="field"><label>Athlete</label><select id="scoreAthlete"><option value="">All athletes</option>${athletes.map(a=>`<option value="${esc(a.id)}">${esc(athleteName(a.id))}</option>`).join('')}</select></div><div class="field"><label>Workout</label><select id="scoreWod"><option value="">All workouts</option>${wods.map(w=>`<option value="${esc(w.id)}">${esc(w.name)}</option>`).join('')}</select></div><div class="field"><label>Division</label><select id="scoreDivision"><option value="">All divisions</option>${['RX','Intermediate','Beginner','Masters','At Home'].map(x=>`<option>${x}</option>`).join('')}</select></div></div></div><div class="resultMeta"><div><b id="scoreCount">${rows.length} results</b><div class="muted">Newest results appear first.</div></div><button class="link" id="clearScoreFilters">Clear filters</button></div><div class="card" id="scoreTable"></div>`;const apply=()=>{const query=$('#scoreSearch').value.trim().toLowerCase(),aid=$('#scoreAthlete').value,wid=$('#scoreWod').value,division=$('#scoreDivision').value,filtered=rows.filter(s=>(!aid||s.athlete_id===aid)&&(!wid||s.wod_id===wid)&&(!division||s.division===division)&&(!query||`${athleteName(s.athlete_id)} ${S.wods.find(w=>w.id===s.wod_id)?.name||''}`.toLowerCase().includes(query)));$('#scoreCount').textContent=`${filtered.length} ${filtered.length===1?'result':'results'}`;$('#scoreTable').innerHTML=scoreTable(filtered,{showAthlete:true,actions:true});document.querySelectorAll('.deleteScore').forEach(b=>b.onclick=async()=>{const s=S.scores.find(x=>x.id===b.dataset.score),w=S.wods.find(x=>x.id===s?.wod_id);if(!s||!confirm(`Remove ${athleteName(s.athlete_id)}'s ${w?.name||'workout'} score from ${s.score_date}?`))return;b.disabled=true;try{const{error}=await sb.from('scores').delete().eq('id',s.id);if(error)throw error;await load();toast('Score removed');renderScores()}catch(e){b.disabled=false;fail(e)}})};['#scoreSearch','#scoreAthlete','#scoreWod','#scoreDivision'].forEach(sel=>{const el=$(sel);el[sel==='#scoreSearch'?'oninput':'onchange']=apply});$('#clearScoreFilters').onclick=()=>{$('#scoreSearch').value='';$('#scoreAthlete').value='';$('#scoreWod').value='';$('#scoreDivision').value='';apply()};$('#logScore').onclick=()=>scoreForm(true);apply()}
function scoreForm(coach=false,preWod=null){const athletes=coach?S.athletes.filter(a=>a.status==='Active'):S.athletes.filter(a=>a.id===ctx.profile.athlete_id);modal(`<div class="sectionHead"><div><h2>Log Score</h2></div><button class="btn secondary close">Close</button></div><form id="scoreForm" class="form"><div class="cols"><div class="field"><label>Athlete</label><select id="sa">${athletes.map(a=>`<option value="${a.id}">${esc(a.first_name+' '+a.last_name)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="sd" type="date" value="${today()}"></div></div><div class="field"><label>WOD</label><select id="sw">${S.wods.map(w=>`<option value="${w.id}" ${preWod===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div><div class="field"><label>Division</label><select id="sdiv"><option>RX</option><option>Intermediate</option><option>Beginner</option><option>Masters</option><option>At Home</option></select></div><div id="scoreFields"></div><div class="field"><label>Notes</label><textarea id="snotes"></textarea></div><button class="btn">Save Score</button></form>`);$('.close').onclick=closeModal;const fields=()=>{const w=S.wods.find(x=>x.id===$('#sw').value),div=$('#sdiv').value,type=w?.scaling_score_types?.[div]||w?.score_type||'custom';let h='';if(type==='time')h='<div class="cols"><div class="field"><label>Minutes</label><input id="smin" type="number" min="0" value="0"></div><div class="field"><label>Seconds</label><input id="ssec" type="number" min="0" max="59" value="0"></div></div>';else if(type==='rounds_reps')h='<div class="cols"><div class="field"><label>Rounds</label><input id="srounds" type="number" min="0"></div><div class="field"><label>Extra reps</label><input id="sreps" type="number" min="0"></div></div>';else if(type==='interval_times')h='<div class="field"><label>Round times (mm:ss, comma separated)</label><input id="sintervals" placeholder="2:10, 2:18, 2:22"></div>';else if(type==='total_weight')h='<div class="cols"><div class="field"><label>Back squat</label><input id="sl1" type="number"></div><div class="field"><label>Strict press</label><input id="sl2" type="number"></div></div><div class="field"><label>Deadlift</label><input id="sl3" type="number"></div>';else if(['reps','weight','distance','calories','points'].includes(type))h=`<div class="field"><label>${type}</label><input id="snum" type="number" step="any"></div>`;else h='<div class="field"><label>Result / completion note</label><input id="scustom"></div>';$('#scoreFields').innerHTML=h;$('#scoreFields').dataset.type=type};$('#sw').onchange=fields;$('#sdiv').onchange=fields;fields();$('#scoreForm').onsubmit=async e=>{e.preventDefault();const type=$('#scoreFields').dataset.type,row={score_date:$('#sd').value,athlete_id:$('#sa').value,wod_id:$('#sw').value,division:$('#sdiv').value,score_type:type,notes:$('#snotes').value};if(type==='time')row.time_seconds=Number($('#smin').value||0)*60+Number($('#ssec').value||0);else if(type==='rounds_reps'){row.rounds=Number($('#srounds').value||0);row.reps=Number($('#sreps').value||0)}else if(type==='interval_times')row.interval_seconds=$('#sintervals').value.split(',').map(v=>{let[a,b]=v.trim().split(':').map(Number);return b===undefined?a:a*60+b}).filter(Number.isFinite);else if(type==='total_weight'){row.lift_weights=[$('#sl1'),$('#sl2'),$('#sl3')].map(x=>Number(x.value||0));row.weight=row.lift_weights.reduce((a,b)=>a+b,0)}else if(['reps','weight','distance','calories','points'].includes(type))row[type]=Number($('#snum').value||0);else row.custom_text=$('#scustom').value;let{error}=await sb.from('scores').insert(row);if(error)throw error;closeModal();await load();render();toast('Score saved')}}
async function renderToday(request){const d=today(),aid=ctx.profile.athlete_id;await loadAvailability(d);if(request!==viewRequest||tab!=='today')return;const prog=wodForDate(d);$('#view').innerHTML=`<div class="sectionHead"><div><h2>${humanDate(d)}</h2><p>Your workout, score status, leaderboard, and class reservations in one place.</p></div><span class="badge ${published(d)?'live':'draft'}">${published(d)?'Published':'Not published'}</span></div>${published(d)&&prog.length?`<div class="grid g2">${prog.map(x=>{const logged=S.scores.filter(s=>s.athlete_id===aid&&s.score_date===d&&s.wod_id===x.wod.id);return`<div class="card">${wodHtml(x.wod,false)}<div class="todayActions"><div class="scoreStatus">${logged.length?`<span class="eyebrow">Score logged</span><strong>${logged.map(s=>`${esc(s.division)} · ${esc(scoreValue(s))}`).join('<br>')}</strong>`:'<span class="muted">Ready when you finish the workout.</span>'}</div><div class="row wrap"><button class="btn small todayLog" data-w="${esc(x.wod.id)}">${logged.length?'Log another':'Log my score'}</button><button class="btn secondary small todayLeader" data-w="${esc(x.wod.id)}">View leaderboard</button></div></div></div>`}).join('')}</div>`:`<div class="card empty">Today's workout has not been published yet.</div>`}<div class="card" style="margin-top:16px"><div class="sectionHead"><div><h2>Reserve a class</h2><p>Cancel any time before check-in to reopen your spot.</p></div></div>${classList(d,false)}</div>`;document.querySelectorAll('.todayLog').forEach(b=>b.onclick=()=>scoreForm(false,b.dataset.w));document.querySelectorAll('.todayLeader').forEach(b=>b.onclick=()=>{sessionStorage.leaderDate=d;sessionStorage.leaderWod=b.dataset.w;go('leaderboard')});bindClassActions()}
async function renderSchedule(request){const d=sessionStorage.athDate||today();await loadAvailability(d);if(request!==viewRequest||tab!=='schedule')return;$('#view').innerHTML=`<div class="sectionHead"><div><h2>Class Schedule</h2><p>Choose a date, reserve a spot, or join the waitlist if a class is full.</p></div><input id="athDate" type="date" value="${d}" style="padding:9px;border:1px solid var(--line);border-radius:9px"></div><div class="card">${classList(d,false)}</div>`;$('#athDate').onchange=e=>{sessionStorage.athDate=e.target.value;render().catch(fail)};bindClassActions()}
async function renderLeaderboard(request){
  const d=sessionStorage.leaderDate||today(),{data,error}=await sb.rpc('get_leaderboard',{p_date:d});
  if(request!==viewRequest||tab!=='leaderboard')return;
  if(error)throw error;
  const rows=data||[],programmed=published(d)?wodForDate(d).map(x=>x.wod):[],savedWod=sessionStorage.leaderWod,wod=programmed.find(w=>w.id===savedWod)||programmed[0];
  const divisions=['All','RX','Intermediate','Beginner','Masters','At Home'],savedDivision=sessionStorage.leaderDivision,division=divisions.includes(savedDivision)?savedDivision:'All';
  const attempts=wod?rows.filter(s=>s.wod_id===wod.id&&(division==='All'||s.division===division)):[];
  const groups={};
  attempts.forEach(s=>{const key=division==='All'?s.athlete_id+'|'+s.division:s.athlete_id;(groups[key]??=[]).push(s)});
  const ranked=Object.values(groups).map(g=>best(g)).filter(Boolean).sort((a,b)=>compareScores(a,b)||a.athlete_name.localeCompare(b.athlete_name));
  let last=null,lastRank=0;
  ranked.forEach((s,i)=>{if(!last||compareScores(last,s)!==0)lastRank=i+1;s.rank=lastRank;last=s});
  const podium=ranked.slice(0,3),filterLabel=division==='All'?'All divisions':division;
  $('#view').innerHTML=`<div class="sectionHead"><div><h2>Athlete Leaderboard</h2><p>Best score per athlete and division for published workouts. Personal notes remain private.</p></div><div class="dateNav"><input id="leaderDate" type="date" value="${d}"></div></div><div class="card"><div class="field"><label>Workout</label><select id="leaderWod" ${programmed.length?'':'disabled'}>${programmed.map(w=>`<option value="${w.id}" ${w.id===wod?.id?'selected':''}>${esc(w.name)}</option>`).join('')||'<option>No published workout</option>'}</select></div><div class="divisionTabs">${divisions.map(x=>`<button class="${x===division?'active':''}" data-division="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>${podium.length?`<div class="grid g3" style="margin-top:16px">${podium.map(s=>`<div class="card"><span class="eyebrow">#${s.rank} · ${esc(s.division)}</span><h3 style="margin:7px 0 4px">${esc(s.athlete_name)}</h3><strong style="font-size:25px;color:var(--aqua2)">${esc(scoreValue(s))}</strong></div>`).join('')}</div>`:''}<div class="card" style="margin-top:16px"><div class="sectionHead"><div><h2>${wod?esc(wod.name):'Leaderboard'}</h2><p>${wod?`${esc(humanDate(d))} · ${esc(filterLabel)}`:'Choose a published workout date to see results.'}</p></div><span class="badge ${ranked.length?'live':'draft'}">${ranked.length} ${ranked.length===1?'result':'results'}</span></div>${ranked.length?`<div class="tableWrap"><table class="table"><thead><tr><th>Rank</th><th>Athlete</th><th>Division</th><th>Score</th></tr></thead><tbody>${ranked.map(s=>`<tr><td><b>#${s.rank}</b></td><td>${esc(s.athlete_name)}</td><td><span class="badge ${s.division==='RX'?'rx':''}">${esc(s.division)}</span></td><td><b>${esc(scoreValue(s))}</b></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${wod?(division==='All'?'No scores have been posted for this workout yet.':'No '+esc(division)+' scores have been posted for this workout yet.'):'No published workout is available for this date.'}</div>`}</div>`;
  $('#leaderDate').onchange=e=>{sessionStorage.leaderDate=e.target.value;sessionStorage.removeItem('leaderWod');render().catch(fail)};
  if(programmed.length)$('#leaderWod').onchange=e=>{sessionStorage.leaderWod=e.target.value;render().catch(fail)};
  document.querySelectorAll('[data-division]').forEach(b=>b.onclick=()=>{sessionStorage.leaderDivision=b.dataset.division;render().catch(fail)});
}
function renderResults(){const aid=ctx.profile.athlete_id,rows=S.scores.filter(s=>s.athlete_id===aid).sort((a,b)=>b.score_date.localeCompare(a.score_date));const groups={};rows.forEach(s=>{const k=s.wod_id+'|'+s.division;(groups[k]??=[]).push(s)});const prs=Object.values(groups).map(g=>best(g)).filter(Boolean).slice(0,12);$('#view').innerHTML=`<div class="sectionHead"><div><h2>My Results</h2><p>Workout history and division-specific bests.</p></div><button id="athLog" class="btn">+ Log Score</button></div><div class="grid g3">${prs.map(s=>`<div class="card"><span class="eyebrow">${esc(s.division)} PR</span><h3 style="margin:6px 0">${esc(S.wods.find(w=>w.id===s.wod_id)?.name||'Workout')}</h3><strong style="font-size:22px">${esc(scoreValue(s))}</strong></div>`).join('')}</div><div class="card" style="margin-top:16px">${scoreTable(rows)}</div>`;$('#athLog').onclick=()=>scoreForm(false)}
function best(g){if(!g.length)return null;return g.reduce((a,b)=>compareScores(a,b)<=0?a:b)}
function compareScores(a,b){const type=a?.score_type||b?.score_type,am=scoreMetric(a),bm=scoreMetric(b);if(['time','interval_times'].includes(type))return am-bm;if(['weight','distance','calories','points','reps','total_weight','rounds_reps'].includes(type))return bm-am;return 0}
function scoreMetric(s){if(!s)return 0;if(s.score_type==='time')return s.time_seconds==null?Number.POSITIVE_INFINITY:Number(s.time_seconds);if(s.score_type==='interval_times')return(s.interval_seconds||[]).length?(s.interval_seconds||[]).reduce((a,b)=>a+Number(b),0):Number.POSITIVE_INFINITY;if(s.score_type==='rounds_reps')return Number(s.rounds||0)*1000000+Number(s.reps||0);return Number(scoreNum(s)||0)}
function scoreNum(s){return s.score_type==='total_weight'?(s.weight??(s.lift_weights||[]).reduce((a,b)=>a+Number(b),0)):s[s.score_type]??0}
function modal(html){$('#modalBox').innerHTML=html;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()}
async function boot(){try{ctx=await authCtx();if(!ctx?.profile){$('#auth').classList.remove('hidden');$('#app').classList.add('hidden');return}await load();$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');shell()}catch(e){fail(e)}}
$('#signInTab').onclick=()=>{mode='signin';$('#signInTab').classList.add('active');$('#signUpTab').classList.remove('active');$('#nameField').classList.add('hidden');$('#authSubmit').textContent='Sign In';$('#authPassword').autocomplete='current-password'};$('#signUpTab').onclick=()=>{mode='signup';$('#signUpTab').classList.add('active');$('#signInTab').classList.remove('active');$('#nameField').classList.remove('hidden');$('#authSubmit').textContent='Create Account';$('#authPassword').autocomplete='new-password'};
$('#authForm').onsubmit=async e=>{e.preventDefault();$('#authMsg').textContent='Working…';try{if(mode==='signup'){const{data,error}=await sb.auth.signUp({email:$('#authEmail').value,password:$('#authPassword').value,options:{data:{full_name:$('#authName').value.trim()}}});if(error)throw error;if(!data.session){$('#authMsg').textContent='Account created. Check your email for the confirmation link, then return here and sign in.';return}}else{const{error}=await sb.auth.signInWithPassword({email:$('#authEmail').value,password:$('#authPassword').value});if(error)throw error}$('#authMsg').textContent='';await boot()}catch(x){$('#authMsg').textContent=x.message;$('#authMsg').style.color='#b94d3d'}};
async function logout(){const buttons=['#signOutSide','#signOutTop'].map($).filter(Boolean),labels=buttons.map(b=>b.textContent);buttons.forEach(b=>{b.disabled=true;b.textContent='Signing out…'});const{error}=await sb.auth.signOut();if(error){buttons.forEach((b,i)=>{b.disabled=false;b.textContent=labels[i]});throw error}ctx=null;tab='';location.reload()}$('#signOutSide').onclick=()=>logout().catch(fail);$('#signOutTop').onclick=()=>logout().catch(fail);
sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')location.reload()});boot();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(err => console.warn('PWA setup unavailable', err))); }
</script>
</body></html>
